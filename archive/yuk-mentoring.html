<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Broadcast Info Yuk Mentoring UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <!-- Header / Navbar -->
    <header class="bg-emerald-700 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <div class="flex flex-wrap justify-between items-start gap-3">
                <div>
                    <span class="bg-emerald-600 text-emerald-100 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">FUKI Fasilkom UI</span>
                    <h1 class="text-2xl font-bold mt-1">Generator Broadcast Info Yuk Mentoring UI</h1>
                    <p class="text-emerald-100 text-sm">Automasi personalisasi pesan ajakan lanjut mentoring keagamaan Pacil UI</p>
                </div>
                <a href="join-group.html" class="text-emerald-100 hover:text-white text-sm font-semibold flex items-center gap-1.5 bg-emerald-800/40 px-3 py-2 rounded-lg transition">
                    Generator Reminder Join Group <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">

        <!-- Main Workspace (Form + Preview) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- Form Input (5 Cols) -->
            <div class="lg:col-span-5 bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-emerald-600"></i> Atur Pesan & Kontak
                </h2>

                <form id="broadcastForm" class="space-y-4">

                    <!-- Data MABA -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nama MABA *</label>
                        <input type="text" id="nama_maba" placeholder="Contoh: Dika"
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm">
                    </div>

                    <hr class="border-slate-100">

                    <!-- Data Pengajak (Pengirim Broadcast) -->
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
                        <p class="text-xs font-bold uppercase text-slate-600 mb-2">Data Diri Pengajak</p>

                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-1">Nama Pengajak *</label>
                            <input type="text" id="nama_pengajak" placeholder="Contoh: Ali"
                                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm">
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-1">Angkatan Pengajak *</label>
                            <input type="text" id="angkatan_pengajak" placeholder="Contoh: 2023"
                                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm">
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <!-- Nomor WhatsApp -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nomor WhatsApp Target</label>
                        <p class="text-[11px] text-slate-400 mb-2">Format: 08xx... atau 628xx...</p>
                        <div class="relative">
                            <span class="absolute left-3 top-2.5 text-slate-400"><i class="fa-brands fa-whatsapp"></i></span>
                            <input type="tel" id="nomor_wa" placeholder="Contoh: 08123456789"
                                class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm font-semibold">
                        </div>
                    </div>

                </form>
            </div>

            <!-- Preview & Action Box (7 Cols) -->
            <div class="lg:col-span-7 flex flex-col justify-between bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div>
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-comment-dots text-emerald-600"></i> Hasil Generasi Broadcast
                        </h2>
                    </div>

                    <!-- Result Box (Menggunakan DIV agar bisa memuat span KOSONG merah) -->
                    <div id="resultDisplay" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-sm leading-relaxed min-h-[300px] whitespace-pre-wrap font-sans overflow-y-auto"></div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-6 pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center gap-3">
                    <button id="btnCopy" onclick="copyBroadcast()"
                        class="w-full sm:w-1/2 py-3 px-4 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-sm active:scale-95">
                        <i class="fa-regular fa-copy"></i> Copy Teks Pesan
                    </button>
                    <button id="btnWA" onclick="sendWhatsApp()"
                        class="w-full sm:w-1/2 py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-sm active:scale-95">
                        <i class="fa-brands fa-whatsapp text-lg"></i> Kirim ke WhatsApp
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">Tindakan berhasil!</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // DOM Elements
        const formEl = document.getElementById('broadcastForm');
        const resultDisplay = document.getElementById('resultDisplay');
        const waInput = document.getElementById('nomor_wa');

        let plainTextResult = ''; // Menyimpan versi plain text murni tanpa HTML (untuk copy/WA)

        // Fungsi Helper Mengambil Nilai atau Mengubah Jadi "KOSONG"
        function getVal(id, format = 'html') {
            const val = document.getElementById(id).value.trim();
            if (val === '') {
                return format === 'html' ? '<span class="text-red-600 font-bold">KOSONG</span>' : 'KOSONG';
            }
            return val;
        }

        // Main Generator Function
        function generateBroadcast() {
            // Format HTML (Untuk Tampilan Web)
            const hNamaP = getVal('nama_maba', 'html');
            const hNamaA = getVal('nama_pengajak', 'html');
            const hAngkA = getVal('angkatan_pengajak', 'html');

            // Format Plain Text (Untuk Clipboard & WA)
            const pNamaP = getVal('nama_maba', 'plain');
            const pNamaA = getVal('nama_pengajak', 'plain');
            const pAngkA = getVal('angkatan_pengajak', 'plain');

            const htmlMsg = `Bismillah, Assalamualaikum!
Haloo ${hNamaP}! Perkenalkan, aku ${hNamaA} dari Fasilkom ${hAngkA}. Aku dapat kontak kamu dari Adkesma BEM Pacil UI 🙏😊
Selamat yaaa sudah menjadi bagian dari Pacil UI! 🥳 Semoga perjalanan kuliahnya nanti dimudahkan dan dipenuhi pengalaman yang berharga, aamiin.
Aku izin menghubungi kamu sebagai perwakilan dari FUKI Fasilkom UI 2026. Dari data yang kamu isi melalui GForm Adkesma BEM Pacil UI, kamu terdata pernah mengikuti mentoring keagamaan sebelumnya. Karena itu, aku mau mengajak kamu untuk melanjutkan mentoring keagamaan Islam di UI! ✨
Mentoring ini nantinya menjadi wadah untuk belajar dan bertumbuh bersama dalam suasana Islami, dengan 1 kakak mentor dan beberapa teman satu kelompok (baik itu pacil atau fakultas lain). Selain belajar keislaman, insyaAllah mentoring juga bisa menjadi tempat untuk sharing, diskusi, saling support dalam perkuliahan, dan tentunya menambah relasi dengan kakak tingkat maupun teman-teman pacil dan ui lainnya.
Kalau kamu tertarik untuk melanjutkan mentoring di Pacil UI, kamu bisa langsung mendaftarkan diri melalui:
🔗 https://www.yukmentoringui.id/
Nanti pendaftarannya akan diproses terlebih dahulu, dan akan dikabari lagi ketika mentor dan kelompok mentoringmu sudah terbentuk 🙌😊
Kalau ada yang ingin ditanyakan tentang mentoringnya, boleh banget langsung tanyakan ke aku yaa! Jangan sungkan 🤗✨
Semoga Allah mudahkan langkah kita untuk terus belajar dan bertumbuh bersama. Yassarallah!`;

            const plainMsg = `Bismillah, Assalamualaikum!
Haloo ${pNamaP}! Perkenalkan, aku ${pNamaA} dari Fasilkom ${pAngkA}. Aku dapat kontak kamu dari Adkesma BEM Pacil UI 🙏😊
Selamat yaaa sudah menjadi bagian dari Pacil UI! 🥳 Semoga perjalanan kuliahnya nanti dimudahkan dan dipenuhi pengalaman yang berharga, aamiin.
Aku izin menghubungi kamu sebagai perwakilan dari FUKI Fasilkom UI 2026. Dari data yang kamu isi melalui GForm Adkesma BEM Pacil UI, kamu terdata pernah mengikuti mentoring keagamaan sebelumnya. Karena itu, aku mau mengajak kamu untuk melanjutkan mentoring keagamaan Islam di UI! ✨
Mentoring ini nantinya menjadi wadah untuk belajar dan bertumbuh bersama dalam suasana Islami, dengan 1 kakak mentor dan beberapa teman satu kelompok (baik itu pacil atau fakultas lain). Selain belajar keislaman, insyaAllah mentoring juga bisa menjadi tempat untuk sharing, diskusi, saling support dalam perkuliahan, dan tentunya menambah relasi dengan kakak tingkat maupun teman-teman pacil dan ui lainnya.
Kalau kamu tertarik untuk melanjutkan mentoring di Pacil UI, kamu bisa langsung mendaftarkan diri melalui:
🔗 https://www.yukmentoringui.id/
Nanti pendaftarannya akan diproses terlebih dahulu, dan akan dikabari lagi ketika mentor dan kelompok mentoringmu sudah terbentuk 🙌😊
Kalau ada yang ingin ditanyakan tentang mentoringnya, boleh banget langsung tanyakan ke aku yaa! Jangan sungkan 🤗✨
Semoga Allah mudahkan langkah kita untuk terus belajar dan bertumbuh bersama. Yassarallah!`;

            resultDisplay.innerHTML = htmlMsg;
            plainTextResult = plainMsg;
        }

        // Fungsionalitas Copy Broadcast Teks
        function copyBroadcast() {
            if(plainTextResult.includes('KOSONG')) {
                showToast('Masih ada data kosong, lengkapi form dulu ya!');
                return;
            }
            navigator.clipboard.writeText(plainTextResult).then(() => {
                showToast('Teks pesan berhasil disalin!');
            });
        }

        // Fungsionalitas WhatsApp
        function sendWhatsApp() {
            let phone = waInput.value.trim();

            if(!phone) {
                showToast('Isi nomor WhatsApp target terlebih dahulu!');
                waInput.focus();
                return;
            }

            if(plainTextResult.includes('KOSONG')) {
                showToast('Lengkapi data form terlebih dahulu sebelum kirim WA!');
                return;
            }

            // Sanitasi dan format nomor telepon
            phone = phone.replace(/\D/g, ''); // Hapus semua karakter non-angka (-, spasi, dll)
            if (phone.startsWith('0')) {
                phone = '62' + phone.substring(1); // Ubah 08 jadi 628
            }

            const encodedText = encodeURIComponent(plainTextResult);
            window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${encodedText}`, '_blank');
        }

        // Fungsi Notifikasi Toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Event Listener ke semua input form
        formEl.addEventListener('input', generateBroadcast);

        // Initial Run
        generateBroadcast();
    </script>
</body>
</html>
