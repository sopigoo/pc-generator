<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Broadcast Reminder Join Group Mentoring</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <!-- Header / Navbar -->
    <header class="bg-emerald-700 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <div class="flex flex-wrap justify-between items-start gap-3">
                <div>
                    <span class="bg-emerald-600 text-emerald-100 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">FUKI Fasilkom UI</span>
                    <h1 class="text-2xl font-bold mt-1">Generator Broadcast Reminder Join Group</h1>
                    <p class="text-emerald-100 text-sm">Automasi pesan ajakan join group mentoring &amp; group SIWAK</p>
                </div>
                <a href="index.html" class="text-emerald-100 hover:text-white text-sm font-semibold flex items-center gap-1.5 bg-emerald-800/40 px-3 py-2 rounded-lg transition">
                    <i class="fa-solid fa-arrow-left"></i> Generator Info Yuk Mentoring
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">

        <!-- Main Workspace (Form + Preview) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- Form Input (5 Cols) -->
            <div class="lg:col-span-5 bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-emerald-600"></i> Atur Pesan &amp; Kontak
                </h2>

                <form id="broadcastForm" class="space-y-4">

                    <!-- Data Anggota -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nama Anggota *</label>
                        <input type="text" id="nama_anggota" placeholder="Contoh: Dika"
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm">
                    </div>

                    <hr class="border-slate-100">

                    <!-- Data Mentor -->
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
                        <p class="text-xs font-bold uppercase text-slate-600 mb-2">Data Diri Mentor</p>

                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-1">Nama Mentor *</label>
                            <input type="text" id="nama_mentor" placeholder="Contoh: Ali"
                                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm">
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-1">Nama / Nomor Kelompok *</label>
                            <input type="text" id="nama_kelompok" placeholder="Contoh: Kelompok 7"
                                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm">
                        </div>
                    </div>

                    <!-- Link Group -->
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
                        <p class="text-xs font-bold uppercase text-slate-600 mb-2">Link Group</p>

                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-1">Link Group Mentoring *</label>
                            <div class="relative">
                                <span class="absolute left-3 top-2 text-slate-400 text-xs"><i class="fa-solid fa-link"></i></span>
                                <input type="url" id="link_mentoring" placeholder="https://chat.whatsapp.com/..."
                                    class="w-full pl-8 pr-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-1">Link Group SIWAK *</label>
                            <div class="relative">
                                <span class="absolute left-3 top-2 text-slate-400 text-xs"><i class="fa-solid fa-link"></i></span>
                                <input type="url" id="link_siwak" placeholder="https://chat.whatsapp.com/..."
                                    class="w-full pl-8 pr-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm">
                            </div>
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <!-- Nomor WhatsApp -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nomor WhatsApp Target</label>
                        <p class="text-[11px] text-slate-400 mb-2">Format: 08xx... atau 628xx...</p>
                        <div class="relative">
                            <span class="absolute left-3 top-2.5 text-slate-400"><i class="fa-brands fa-whatsapp"></i></span>
                            <input type="tel" id="nomor_wa" placeholder="Contoh: 08123456789"
                                class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm font-semibold">
                        </div>
                    </div>

                </form>
            </div>

            <!-- Preview & Action Box (7 Cols) -->
            <div class="lg:col-span-7 flex flex-col justify-between bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div>
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-comment-dots text-emerald-600"></i> Hasil Generasi Broadcast
                        </h2>
                    </div>

                    <!-- Result Box (Menggunakan DIV agar bisa memuat span KOSONG merah) -->
                    <div id="resultDisplay" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-sm leading-relaxed min-h-[300px] whitespace-pre-wrap font-sans overflow-y-auto break-words"></div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-6 pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center gap-3">
                    <button id="btnCopy" onclick="copyBroadcast()"
                        class="w-full sm:w-1/2 py-3 px-4 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-sm active:scale-95">
                        <i class="fa-regular fa-copy"></i> Copy Teks Pesan
                    </button>
                    <button id="btnWA" onclick="sendWhatsApp()"
                        class="w-full sm:w-1/2 py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-sm active:scale-95">
                        <i class="fa-brands fa-whatsapp text-lg"></i> Kirim ke WhatsApp
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">Tindakan berhasil!</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // DOM Elements
        const formEl = document.getElementById('broadcastForm');
        const resultDisplay = document.getElementById('resultDisplay');
        const waInput = document.getElementById('nomor_wa');

        let plainTextResult = ''; // Menyimpan versi plain text murni tanpa HTML (untuk copy/WA)

        // Fungsi Helper Mengambil Nilai atau Mengubah Jadi "KOSONG"
        function getVal(id, format = 'html') {
            const val = document.getElementById(id).value.trim();
            if (val === '') {
                return format === 'html' ? '<span class="text-red-600 font-bold">KOSONG</span>' : 'KOSONG';
            }
            return format === 'html' ? escapeHtml(val) : val;
        }

        // Escape karakter HTML supaya input user tidak merusak tampilan preview
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        // Main Generator Function
        function generateBroadcast() {
            // Format HTML (Untuk Tampilan Web)
            const hNama = getVal('nama_anggota', 'html');
            const hMentor = getVal('nama_mentor', 'html');
            const hKelompok = getVal('nama_kelompok', 'html');
            const hLinkMentoring = getVal('link_mentoring', 'html');
            const hLinkSiwak = getVal('link_siwak', 'html');

            // Format Plain Text (Untuk Clipboard & WA)
            const pNama = getVal('nama_anggota', 'plain');
            const pMentor = getVal('nama_mentor', 'plain');
            const pKelompok = getVal('nama_kelompok', 'plain');
            const pLinkMentoring = getVal('link_mentoring', 'plain');
            const pLinkSiwak = getVal('link_siwak', 'plain');

            // Bold di HTML pakai <strong>, di WhatsApp pakai *teks*
            const htmlMsg = `Assalamu'alaikum, ${hNama}! 👋

Halo! Aku ${hMentor}, mentor dari kelompok mentoring ${hKelompok} 😊

Aku lihat kamu <strong>belum join group mentoring</strong> nih, mohon segera join yaa karena info, koordinasi, dan berbagai kegiatan mentoring akan disampaikan melalui group tersebut.

Selain group mentoring, jangan lupa juga untuk <strong>join group SIWAK secara umum</strong> supaya kamu tidak ketinggalan informasi dan kegiatan SIWAK lainnya.

📌 <strong>Group Mentoring:</strong> ${hLinkMentoring}
📌 <strong>Group SIWAK:</strong> ${hLinkSiwak}

Mohon segera join kedua group di atas yaa. Kalau ada kendala saat join, boleh langsung chat aku 🙌

Jazakumullahu khairan! ✨`;

            const plainMsg = `Assalamu'alaikum, ${pNama}! 👋

Halo! Aku ${pMentor}, mentor dari kelompok mentoring ${pKelompok} 😊

Aku lihat kamu *belum join group mentoring* nih, mohon segera join yaa karena info, koordinasi, dan berbagai kegiatan mentoring akan disampaikan melalui group tersebut.

Selain group mentoring, jangan lupa juga untuk *join group SIWAK secara umum* supaya kamu tidak ketinggalan informasi dan kegiatan SIWAK lainnya.

📌 *Group Mentoring:* ${pLinkMentoring}
📌 *Group SIWAK:* ${pLinkSiwak}

Mohon segera join kedua group di atas yaa. Kalau ada kendala saat join, boleh langsung chat aku 🙌

Jazakumullahu khairan! ✨`;

            resultDisplay.innerHTML = htmlMsg;
            plainTextResult = plainMsg;
        }

        // Fungsionalitas Copy Broadcast Teks
        function copyBroadcast() {
            if(plainTextResult.includes('KOSONG')) {
                showToast('Masih ada data kosong, lengkapi form dulu ya!');
                return;
            }
            navigator.clipboard.writeText(plainTextResult).then(() => {
                showToast('Teks pesan berhasil disalin!');
            });
        }

        // Fungsionalitas WhatsApp
        function sendWhatsApp() {
            let phone = waInput.value.trim();

            if(!phone) {
                showToast('Isi nomor WhatsApp target terlebih dahulu!');
                waInput.focus();
                return;
            }

            if(plainTextResult.includes('KOSONG')) {
                showToast('Lengkapi data form terlebih dahulu sebelum kirim WA!');
                return;
            }

            // Sanitasi dan format nomor telepon
            phone = phone.replace(/\D/g, ''); // Hapus semua karakter non-angka (-, spasi, dll)
            if (phone.startsWith('0')) {
                phone = '62' + phone.substring(1); // Ubah 08 jadi 628
            }

            const encodedText = encodeURIComponent(plainTextResult);
            window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${encodedText}`, '_blank');
        }

        // Fungsi Notifikasi Toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Event Listener ke semua input form
        formEl.addEventListener('input', generateBroadcast);

        // Initial Run
        generateBroadcast();
    </script>
</body>
</html>
